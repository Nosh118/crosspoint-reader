name: X4 Fast-DU 40MHz + grayscale power fix

on:
  push:
    branches: [x4-fastdu40-graypowerfix]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: latest
          enable-cache: false
      - name: Install PlatformIO Core
        run: uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip
      - name: Enable X4 Fast-DU shortcut and 40 MHz SPI
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('platformio.ini')
          s = p.read_text()
          needle = '  -DFREEINK_DEVICE_X3=1\n'
          repl = needle + '  -DFREEINK_X4_FAST_DU_SHORTCUT\n  -DFREEINK_X4_OVERCLOCK_SPI\n'
          if needle not in s:
              raise SystemExit('platformio target not found')
          p.write_text(s.replace(needle, repl, 1))
          PY
      - name: Patch X4 grayscale rail settle
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('freeink-sdk/libs/display/FreeInkDisplay/src/driver/Ssd1677Driver.cpp')
          s = p.read_text()
          needle = '    if (_cfg.grayPowerUpFirst) powerOn(bus);\n    refresh(bus, RefreshMode::Fast, turnOff);\n'
          repl = '    if (_cfg.grayPowerUpFirst || !_isScreenOn) powerOn(bus);\n    refresh(bus, RefreshMode::Fast, turnOff);\n'
          count = s.count(needle)
          if count != 1:
              raise SystemExit(f'grayscale power-up target count was {count}, expected 1')
          p.write_text(s.replace(needle, repl, 1))
          PY
      - name: Build X4 firmware
        run: pio run -e default
      - name: Upload firmware
        uses: actions/upload-artifact@v6
        with:
          name: x4-fastdu40-graypowerfix-firmware
          path: .pio/build/default/firmware.bin
          if-no-files-found: error
